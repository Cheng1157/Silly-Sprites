!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Sprites</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        #stage {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .screen {
            display: block;
        }
        .hidden {
            display: none;
        }
        .eyebrow {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="stage">
        <section id="intro" class="screen">
            <p class="eyebrow">A digital card game</p>
            <h1>Welcome to Silly Sprites!</h1>
        </section>
        
        <section id="card" class="screen hidden">
            <div class="top">
                <p class="num"><span id="num">01</span></p>
            </div>
        </section>
        
        <section id="end" class="screen hidden">
            <p class="eyebrow">Game over</p>
            <h1>That's all 60 cards!</h1>
        </section>
    </div>

    <script>
        var IMGS = {
            "c01": "creature1.jpeg",
            "c02": "creature2.jpeg",
            "c03": "creature3.jpeg",
            "c04": "creature4.jpeg",
            "c05": "creature5.jpeg",
            "c06": "creature6.jpeg",
            "c07": "creature7.jpeg",
            "c08": "creature8.jpeg",
            "c09": "creature9.jpeg",
            "c10": "creature10.jpeg",
            "c11": "creature11.jpeg",
            "c12": "creature12.jpeg"
        };
    </script>
</body>
</html>
